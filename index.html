<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventPulse - Book Tech Conferences & Workshops</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header & Navigation -->
  <header class="navbar">
    <div class="logo">Event<span>Pulse</span></div>
    <div class="nav-right">
      <input type="text" id="search-box" placeholder="Search events..." />
      <button class="cart-btn" id="view-bookings-btn">My Bookings (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Discover & Book Top Tech Events</h1>
    <p>Hands-on workshops, developer summits, and coding hackathons.</p>
  </section>

  <!-- Filter Category Buttons -->
  <div class="filter-container">
    <button class="filter-btn active" data-category="all">All Events</button>
    <button class="filter-btn" data-category="tech">Tech Talks</button>
    <button class="filter-btn" data-category="workshop">Workshops</button>
    <button class="filter-btn" data-category="hackathon">Hackathons</button>
  </div>

  <!-- Events Grid -->
  <main class="events-grid" id="events-grid"></main>

  <!-- Booking Modal / Popup -->
  <div class="modal-overlay hidden" id="booking-modal">
    <div class="modal">
      <h3 id="modal-event-title">Book Ticket</h3>
      <p id="modal-event-price" class="modal-price"></p>
      <form id="booking-form">
        <label>Your Name:</label>
        <input type="text" id="user-name" required placeholder="Harsh Pareek" />
        <label>Email Address:</label>
        <input type="email" id="user-email" required placeholder="harsh@example.com" />
        <label>Number of Tickets:</label>
        <input type="number" id="ticket-qty" min="1" max="5" value="1" required />
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="close-modal-btn">Cancel</button>
          <button type="submit" class="btn-confirm">Confirm Booking</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Bookings Modal -->
  <div class="modal-overlay hidden" id="my-bookings-modal">
    <div class="modal bookings-list-modal">
      <h3>My Confirmed Bookings</h3>
      <div id="bookings-content"></div>
      <div class="modal-actions" style="margin-top:15px;">
        <button class="btn-cancel" id="close-my-bookings">Close</button>
        <button class="btn-clear" id="clear-all-bookings">Clear All</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
